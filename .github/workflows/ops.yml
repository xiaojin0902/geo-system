name: 操作台（手动触发功能）

on:
  workflow_dispatch:
    inputs:
      action:
        description: '要执行的操作'
        required: true
        default: 'audit'
        type: choice
        options: [diagnose, audit, questions, demo, build]
      engines:
        description: '引擎（diagnose 用）：live / mock / deepseek / dashscope,doubao'
        required: false
        default: 'live'
      limit:
        description: '题数（diagnose/demo 用）'
        required: false
        default: '12'
      url:
        description: '网址（audit 用，留空则用品牌配置里的 urls[0]）'
        required: false
        default: ''
      keywords:
        description: '关键词（questions/报价用，逗号分隔；报价格式 词:难度）'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: geo-pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 执行操作
        env:
          ACT: ${{ inputs.action }}
          ENGINES: ${{ inputs.engines }}
          LIMIT: ${{ inputs.limit }}
          TARGET_URL: ${{ inputs.url }}
          KEYWORDS: ${{ inputs.keywords }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          YUANBAO_BASE_URL: ${{ secrets.YUANBAO_BASE_URL }}
          YUANBAO_API_KEY: ${{ secrets.YUANBAO_API_KEY }}
        run: |
          set -x
          cd app
          node bin/geo.js init --brand hengye || true
          case "$ACT" in
            diagnose)
              node bin/geo.js diagnose --brand hengye --engines "$ENGINES" --limit "${LIMIT:-12}" --json > /tmp/out.json || true
              ;;
            audit)
              TARGET="${TARGET_URL}"
              if [ -z "$TARGET" ]; then TARGET=$(node -e "const b=require('./brands/hengye.json');console.log((b.urls&&b.urls[0])||'https://sanrenxing.cn')"); fi
              node bin/geo.js audit --url "$TARGET" --json > data/audit-latest.json || true
              echo "AUDIT_TARGET=$TARGET" >> /tmp/out.json
              ;;
            questions)
              node bin/geo.js questions --brand hengye --count 36 --write --json > /tmp/out.json || true
              ;;
            demo)
              node bin/geo.js demo --limit "${LIMIT:-8}" --questions 12 --json > /tmp/out.json || true
              ;;
            build) echo "仅重建站点" ;;
          esac
          echo "---- 输出摘要 ----"; head -c 2000 /tmp/out.json 2>/dev/null || true
      - name: 构建静态系统
        run: node app/scripts/build-site.mjs --out dist-site
      - name: 回写数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f app/data 2>/dev/null || true
          git commit -m "ops: ${{ inputs.action }} @ $(date -u +%FT%TZ)" || echo "无数据变化"
          git pull --rebase -q origin main || true
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
