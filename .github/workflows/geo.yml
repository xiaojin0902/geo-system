name: GEO 每日采集与发布

on:
  schedule:
    - cron: '12 23 * * *'   # UTC 23:12 = 北京时间次日 07:12
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: geo-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 初始化与诊断
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          YUANBAO_BASE_URL: ${{ secrets.YUANBAO_BASE_URL }}
          YUANBAO_API_KEY: ${{ secrets.YUANBAO_API_KEY }}
        run: |
          cd app
          node bin/geo.js init --brand hengye || true
          if [ -n "${DEEPSEEK_API_KEY}" ] || [ -n "${DASHSCOPE_API_KEY}" ]; then
            echo "使用真实引擎采集"
            node bin/geo.js diagnose --brand hengye --engines live --limit 12 || node bin/geo.js diagnose --brand hengye --engines mock --limit 30 || true
          else
            echo "没有配置密钥，使用演示引擎（只验证流水线）"
            node bin/geo.js diagnose --brand hengye --engines mock --limit 30 || true
          fi
      - name: 构建静态系统
        run: node app/scripts/build-site.mjs --out dist-site
      - name: 回写数据（累积历史）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/data/geo.db app/data/reports || true
          git commit -m "data: $(date -u +%F) 采集快照" || echo "无数据变化"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
