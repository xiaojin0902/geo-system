services:
  - type: web
    name: hengye-geo
    runtime: node
    plan: free
    buildCommand: "echo no-build-needed"
    startCommand: "node server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BASIC_USER
        value: hengye
      - key: BASIC_PASS
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEO_BRAND
        value: hengye
